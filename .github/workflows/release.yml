name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"  # runner 默认代码页是 cp1252，输出中文会报错

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        env:
          APP_VERSION: ${{ github.ref_name }}  # tag，例如 v1.2.0
        run: python build.py

      # 额外放一份带版本号的文件：每个版本的文件名都不同，
      # Windows 资源管理器就不会沿用旧版本缓存的图标 (介绍页的下载按钮用这个)
      - name: Add versioned copy
        shell: pwsh
        run: Copy-Item dist/NeteaseDiscordRPC.exe "dist/NeteaseDiscordRPC-$("${{ github.ref_name }}".TrimStart('v')).exe"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NeteaseDiscordRPC.exe
            dist/NeteaseDiscordRPC-*.exe
          generate_release_notes: true
